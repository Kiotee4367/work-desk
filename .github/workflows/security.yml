name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Static analysis (Semgrep, OWASP rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/nextjs --config p/secrets --error --exclude node_modules --exclude .next

  audit:
    name: Known vulnerabilities (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocks on anything high or critical in code that ships to users.
      - run: npm audit --omit=dev --audit-level=high
      # Dev-only tools (linter, build helpers) never reach users. Reported as a
      # warning, not a block, because an advisory with no fix would block forever.
      # Today: braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) via eslint-config-next has no patched release.
      - run: npm audit --audit-level=high || echo "::warning::Dev-only advisories found. See the log above."
